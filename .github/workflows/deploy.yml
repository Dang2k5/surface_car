name: Deploy backend to EC2

on:
  push:
    branches: [feature_dang]
    paths:
      - "backend/**"
      - "agent/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AssumeRoleWithWebIdentity
  contents: read

concurrency:
  group: deploy-ec2-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::757372702635:role/github-actions-visual-qc-deploy
          aws-region: ap-southeast-1

      - name: Deploy via SSM (git pull + docker compose up -d)
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0da4fa435ec1d5d6d \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/surface_car",
              "git fetch origin feature_dang",
              "git reset --hard origin/feature_dang",
              "sudo docker compose up -d --build",
              "sleep 5",
              "sudo docker ps --filter name=surface_car-backend-1 --format \"{{.Names}} {{.Status}}\""
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command $COMMAND_ID"

      - name: Wait for deploy command to finish
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.command_id }}" \
              --instance-id i-0da4fa435ec1d5d6d \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy command failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "${{ steps.deploy.outputs.command_id }}" \
                --instance-id i-0da4fa435ec1d5d6d
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for deploy command"
          exit 1

      - name: Show deploy output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id i-0da4fa435ec1d5d6d

      - name: Verify /health after deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0da4fa435ec1d5d6d \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sleep 90","curl -sf -o /dev/null -w \"health_http_code=%{http_code}\\n\" http://localhost:8000/health"]' \
            --query "Command.CommandId" --output text)
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0da4fa435ec1d5d6d --query Status --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0da4fa435ec1d5d6d --query StandardOutputContent --output text
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0da4fa435ec1d5d6d
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for health check"
          exit 1
