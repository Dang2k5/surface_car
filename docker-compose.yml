version: "3.8"

services:
  # Optional local Object Storage (ENVIRONMENT.md). Start with:
  #   docker compose up minio
  # Then in .env: OBJECT_STORAGE_PROVIDER=minio, S3_ENDPOINT=http://localhost:9000,
  # S3_ACCESS_KEY=minioadmin, S3_SECRET_KEY=minioadmin (change for anything beyond
  # local dev/demo). Not required — leaving S3_ACCESS_KEY/S3_SECRET_KEY unset in
  # .env keeps the backend on local disk storage with no code change.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  minio-data:
