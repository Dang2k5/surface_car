version: "3.8"

services:
  # Object storage is AWS S3 (agent/services/object_storage.py). Set
  # OBJECT_STORAGE_PROVIDER=s3, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY,
  # S3_REGION in .env; leave S3_ACCESS_KEY/S3_SECRET_KEY unset to keep the
  # backend on local disk storage with no code change (dev/demo fallback).
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Caps the container so a memory spike (e.g. two instances briefly
    # overlapping during a deploy) OOM-kills this container instead of
    # starving the whole host.
    mem_limit: 1g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
