services:
  # Object storage is AWS S3 (agent/services/object_storage.py). Set
  # OBJECT_STORAGE_PROVIDER=s3, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY,
  # S3_REGION in .env; leave S3_ACCESS_KEY/S3_SECRET_KEY unset to keep the
  # backend on local disk storage with no code change (dev/demo fallback).
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surface_car-backend-1
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # awslogs-datetime-format is intentionally omitted -- it's a multi-line
    # START-OF-EVENT match pattern (for grouping stack traces under one log
    # event), not a per-line timestamp formatter. Uvicorn's access log lines
    # don't start with an ISO-8601 date, so with that option set every line
    # would fail to match and get silently concatenated into one giant,
    # never-flushed CloudWatch log event instead of one event per line.
    logging:
      driver: awslogs
      options:
        awslogs-group: /aws/ec2/visual-qc/docker/backend
        awslogs-stream: surface_car-backend-1
        awslogs-region: ap-southeast-1
        awslogs-create-group: "true"
    # Requires the NVIDIA Container Toolkit on the host (preinstalled on the
    # AWS Deep Learning AMI) and `docker compose` v2 -- passes the EC2
    # instance's GPU through to the container. Local `docker compose up`
    # without a GPU host will fail to satisfy this reservation; use the CPU
    # branch's compose file for local dev instead.
    #
    # Memory limit/reservation must live under this same `deploy.resources`
    # block (not the legacy top-level mem_limit/mem_reservation keys) --
    # Compose v2 rejects mixing both forms on one service. 4g/2g is higher
    # than the CPU/Railway branch's 1g/512m: the CUDA runtime libs bundled
    # with the GPU torch wheel (see Dockerfile) plus batched video frames
    # held in RAM before predict() need more headroom.
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 2g
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
