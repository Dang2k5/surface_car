overrides:
  rolldown: "1.2.1"

# Supply-chain guard equivalent to the old bunfig.toml (minimumReleaseAge = 86400):
# skip package versions published less than a day ago. Each entry in the exclude
# list below bypasses the guard for one package — confirm with the user before
# adding any (same rule bunfig.toml had for minimumReleaseAgeExcludes).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@lovable.dev/vite-tanstack-config"
  - "@lovable.dev/mcp-js"
  - "@lovable.dev/email-js"
  - "@lovable.dev/webhooks-js"
